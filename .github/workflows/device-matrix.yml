name: Android Device Matrix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api-level: [24, 28, 29, 30, 33, 36]

    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Free space for the Android emulator
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo apt-get clean
    - name: Run API matrix tests
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        arch: x86_64
        profile: pixel_2
        disk-size: 4G
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -partition-size 4096 -camera-front none -camera-back emulated
        pre-emulator-launch-script: |
          sed -i '/^disk.dataPartition.size=/d' "$HOME/.android/avd/test.avd/config.ini"
          printf '%s\n' 'disk.dataPartition.size=4096M' >> "$HOME/.android/avd/test.avd/config.ini"
        script: ./gradlew connectedDebugAndroidTest
