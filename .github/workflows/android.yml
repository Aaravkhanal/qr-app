name: Android CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5
    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Check formatting
      run: bash scripts/check-formatting.sh

    - name: Run unit tests and static analysis
      run: ./gradlew testDebugUnitTest lintDebug

    - name: Build debug and unsigned release variants
      run: ./gradlew assembleDebug assembleRelease bundleRelease

    - name: Validate exported Room schemas
      run: |
        ./gradlew kspDebugKotlin
        git diff --exit-code -- app/schemas

  instrumentation:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
          | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Free space for the Android emulator
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo apt-get clean

    - name: Run instrumentation tests on API 29
      uses: ReactiveCircus/android-emulator-runner@v2
      with:
        api-level: 29
        arch: x86_64
        profile: pixel_2
        disk-size: 4G
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -partition-size 4096 -camera-front none -camera-back emulated
        pre-emulator-launch-script: |
          sed -i '/^disk.dataPartition.size=/d' "$HOME/.android/avd/test.avd/config.ini"
          printf '%s\n' 'disk.dataPartition.size=4096M' >> "$HOME/.android/avd/test.avd/config.ini"
        script: ./gradlew connectedDebugAndroidTest
