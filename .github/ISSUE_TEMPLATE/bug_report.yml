name: Bug report
description: Report a reproducible problem without sharing private QR data
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please use synthetic QR content. Never paste passwords, contact details, or private scan results."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.5"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
